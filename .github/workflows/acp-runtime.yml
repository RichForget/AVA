name: Experimental ACP runtime
on:
  push:
    branches: [fix/acp-runtime-reliability]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acp:
    runs-on: ubuntu-24.04
    env:
      CC: gcc-16
      CXX: g++-16
      GITACHE_ROOT: /tmp/ava-acp-gitache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16 cmake ninja-build libncursesw5-dev pkg-config libboost-dev libdw-dev universal-ctags nodejs npm
      - name: Build pinned TLS dependency
        run: scripts/build-acp-pilot-tls.sh /tmp/ava-acp-tls
      - name: Configure isolated transport
        run: |
          mkdir -p "$GITACHE_ROOT"
          cmake --preset dev -DAVA_ACP_INPROCESS_HTTP=ON -DOPENSSL_ROOT_DIR=/tmp/ava-acp-tls/install -DAVA_REQUIRE_ACP_SDK_INTEROP=ON
      - name: Build native ACP tests
        run: cmake --build build --target ava ava_tests ava_fake_provider_server -j2
      - name: Install pinned SDK
        working-directory: tests/acp-sdk
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify runtime and official SDK
        run: |
          ctest --test-dir build --output-on-failure -R '^ava_tests.acp$|ava_cli.acp_subprocess|ava_cli.acp_sdk_interop|ava_tests.module_dependency_rules$|ava_tests.curl_transport_static_contract'
          git diff --check
